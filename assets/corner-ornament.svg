<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCorner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="30%" stop-color="#e5c158"/>
      <stop offset="70%" stop-color="#c69b2d"/>
      <stop offset="100%" stop-color="#8a6715"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#goldCorner)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sudut Luar Utama -->
    <path d="M5 60 L5 12 C5 8, 8 5, 12 5 L60 5" stroke-width="2.5"/>
