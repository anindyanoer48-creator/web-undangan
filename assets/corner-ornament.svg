    <path d="M25 25 C35 35, 45 25, 48 18" stroke-width="1.5"/>
    <circle cx="48" cy="18" r="2.5" fill="url(#goldCorner)"/>
    <path d="M25 25 C35 35, 25 45, 18 48" stroke-width="1.5"/>
    <circle cx="18" cy="48" r="2.5" fill="url(#goldCorner)"/>
    <!-- Daun Krawangan Pusat -->
    <path d="M20 20 C28 28, 30 20, 32 16 C28 18, 20 20, 20 20 Z" fill="url(#goldCorner)" opacity="0.8"/>
  </g>
