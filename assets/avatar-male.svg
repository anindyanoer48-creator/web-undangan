    <path d="M35 235 L35 200 C38 160, 75 135, 100 135 C125 135, 162 160, 165 200 L165 235" stroke-width="2"/>
    
    <!-- Kancing Beskap Emas -->
    <circle cx="100" cy="150" r="2.5" fill="url(#avatarMaleGold)"/>
    <circle cx="100" cy="170" r="2.5" fill="url(#avatarMaleGold)"/>
    <circle cx="100" cy="190" r="2.5" fill="url(#avatarMaleGold)"/>
