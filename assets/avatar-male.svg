      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="50%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#99701a"/>
    </linearGradient>
    <radialGradient id="bgGradMale" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#143021"/>
