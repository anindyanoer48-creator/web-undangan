<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="100%" height="100%">
  <defs>
    <linearGradient id="goldDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#c69b2d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fff2b2" stop-opacity="1"/>
      <stop offset="75%" stop-color="#c69b2d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#goldDiv)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Garis Horisontal Halus Mengalir -->
    <path d="M20 30 L160 30" stroke-width="1.2"/>
    <path d="M240 30 L380 30" stroke-width="1.2"/>
    
    <!-- Sayap Kiri -->
    <path d="M120 30 C140 22, 160 22, 175 30 C160 38, 140 38, 120 30 Z" stroke-width="1"/>
    <circle cx="110" cy="30" r="2" fill="#e5c158"/>
    <circle cx="90" cy="30" r="1.5" fill="#c69b2d"/>

    <!-- Sayap Kanan -->
    <path d="M280 30 C260 22, 240 22, 225 30 C240 38, 260 38, 280 30 Z" stroke-width="1"/>
    <circle cx="290" cy="30" r="2" fill="#e5c158"/>
    <circle cx="310" cy="30" r="1.5" fill="#c69b2d"/>

    <!-- Bunga Melati / Padma Pusat -->
    <!-- Kelopak Bunga Pusat -->
    <path d="M200 15 C192 24, 192 36, 200 45 C208 36, 208 24, 200 15 Z" fill="#fff5c0" stroke="#c69b2d" stroke-width="1.5"/>
    <path d="M185 30 C194 22, 206 22, 215 30 C206 38, 194 38, 185 30 Z" fill="#e5c158" stroke="#c69b2d" stroke-width="1.5" opacity="0.85"/>
    <circle cx="200" cy="30" r="3.5" fill="#fff" stroke="#99701a" stroke-width="1"/>
    
    <!-- Titik Intan Mahkota -->
    <circle cx="200" cy="10" r="2" fill="#fff2b2"/>
    <circle cx="200" cy="50" r="2" fill="#fff2b2"/>
  </g>
</svg>
