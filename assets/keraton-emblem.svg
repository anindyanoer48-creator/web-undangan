<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="35%" stop-color="#e5c158"/>
      <stop offset="70%" stop-color="#c69b2d"/>
      <stop offset="100%" stop-color="#8a6715"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#emblemGold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lingkaran Luar Berukir -->
    <circle cx="100" cy="100" r="92" stroke-width="2"/>
    <circle cx="100" cy="100" r="86" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="100" cy="100" r="80" stroke-width="1.5"/>

    <!-- Mahkota Keraton (Crown) -->
    <path d="M80 60 L85 45 L95 55 L100 40 L105 55 L115 45 L120 60 Z" stroke-width="2" fill="url(#emblemGold)" fill-opacity="0.2"/>
    <circle cx="100" cy="36" r="3" fill="url(#emblemGold)"/>
    <circle cx="85" cy="42" r="2" fill="url(#emblemGold)"/>
    <circle cx="115" cy="42" r="2" fill="url(#emblemGold)"/>

    <!-- Sayap Lar Kembar (Royal Wings) -->
    <!-- Sayap Kiri -->
    <path d="M70 100 C50 85, 45 65, 40 50 C48 65, 55 80, 68 90" stroke-width="1.8"/>
    <path d="M68 110 C45 100, 35 85, 30 70 C40 85, 50 100, 65 108" stroke-width="1.8"/>
    <path d="M72 120 C50 120, 38 105, 32 90 C42 105, 55 115, 70 118" stroke-width="1.8"/>

    <!-- Sayap Kanan -->
    <path d="M130 100 C150 85, 155 65, 160 50 C152 65, 145 80, 132 90" stroke-width="1.8"/>
    <path d="M132 110 C155 100, 165 85, 170 70 C160 85, 150 100, 135 108" stroke-width="1.8"/>
    <path d="M128 120 C150 120, 162 105, 168 90 C158 105, 145 115, 130 118" stroke-width="1.8"/>

    <!-- Monogram Tradisional Inisial Pengantin "E & E" (Example & Example) -->
    <text x="100" y="112" font-family="'Cinzel', 'Playfair Display', serif" font-size="30" font-weight="600" fill="url(#emblemGold)" text-anchor="middle" letter-spacing="1">E &amp; E</text>
    <path d="M75 125 C90 132, 110 132, 125 125" stroke-width="1.5"/>
    <circle cx="100" cy="135" r="2" fill="url(#emblemGold)"/>

    <!-- Ornamen Bawah Sulur -->
    <path d="M90 145 C95 155, 105 155, 110 145 C105 150, 95 150, 90 145 Z" fill="url(#emblemGold)" opacity="0.8"/>
  </g>
</svg>
