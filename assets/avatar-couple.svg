<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="phGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="50%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#99701a"/>
    </linearGradient>
    <radialGradient id="phBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#153625"/>
      <stop offset="100%" stop-color="#08150f"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#phBg)"/>
  <!-- Decorative Frame -->
  <rect x="20" y="20" width="360" height="460" rx="10" fill="none" stroke="url(#phGold)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <rect x="30" y="30" width="340" height="440" rx="8" fill="none" stroke="url(#phGold)" stroke-width="1"/>
  
  <!-- Center Silhouette of Person / Photo Icon -->
  <g fill="none" stroke="url(#phGold)" stroke-linecap="round" stroke-linejoin="round" transform="translate(100, 140)">
    <!-- Photo Frame Icon -->
    <circle cx="100" cy="70" r="35" stroke-width="2.5" fill="#0f261a"/>
    <path d="M40 180 C45 130, 80 115, 100 115 C120 115, 155 130, 160 180" stroke-width="2.5" fill="#0c1e15"/>
    <path d="M85 65 C85 60, 115 60, 115 65" stroke-width="2"/>
    <circle cx="100" cy="30" r="3" fill="url(#phGold)"/>
  </g>
  <text x="200" y="380" font-family="'Cinzel', serif" font-size="16" fill="url(#phGold)" text-anchor="middle" letter-spacing="2">DOKUMENTASI FOTO</text>
  <text x="200" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a49f8f" text-anchor="middle">Ruang Foto Kenangan</text>
</svg>
